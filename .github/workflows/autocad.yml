name: autocad
on:
  push:
    paths: ['autocad/**', '.github/workflows/autocad.yml']
  pull_request:
    paths: ['autocad/**', '.github/workflows/autocad.yml']
jobs:
  build-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: autocad
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      # The add-in compiles on Linux against AutoCAD reference assemblies (EnableWindowsTargeting).
      - run: dotnet build -c Release
      - run: dotnet test -c Release --no-build
